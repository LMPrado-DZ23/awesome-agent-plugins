# yaml-language-server: $schema=../../../schema/entry.schema.json
id: mcp-memory
name: Memory (reference)
url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
type: mcp-server
category: memory
license: null
tags:
  - knowledge-graph
  - reference
description:
  en: >-
    Reference knowledge-graph memory: entities, relations and observations stored in a local JSONL file. No model or
    embedding service needed.
  pt: >-
    Memória de referência em grafo de conhecimento: entidades, relações e observações num arquivo JSONL local. Não
    precisa de modelo nem embeddings.
mcp:
  name: memory
  stdio:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"
