    Gerencie projetos Supabase pelo agente: tabelas, SQL, migrations, edge functions, logs e docs. Modos somente leitura
    e por projeto via parâmetros na URL.
mcp:
  name: supabase
  http:
    url: https://mcp.supabase.com/mcp
