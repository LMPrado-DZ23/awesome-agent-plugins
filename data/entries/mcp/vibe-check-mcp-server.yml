# yaml-language-server: $schema=../../../schema/entry.schema.json
id: vibe-check-mcp-server
name: PV-Bhat/vibe-check-mcp-server
title: Metacognitive agent oversight
url: https://github.com/PV-Bhat/vibe-check-mcp-server
type: mcp-server
category: workflow
license: MIT
tags:
  - oversight
  - safety
description:
  en: "Metacognitive oversight for AI agents: adaptive interrupts for alignment, reflection, and safety; needs an API key."
  pt: >-
    Supervisão metacognitiva de agentes de IA: interrupções adaptativas para alinhamento, reflexão e segurança; exige
    uma chave de API.
mcp:
  name: vibe-check-mcp-server
  stdio:
    command: npx
    args:
      - "-y"
      - "@pv-bhat/vibe-check-mcp"
    env:
      YOUR_API_KEY: <YOUR_API_KEY>
origin:
  list: mcp-registry
  ref: io.github.PV-Bhat/vibe-check-mcp-server
