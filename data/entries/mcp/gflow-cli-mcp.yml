  pt: Aciona o Google Flow a partir de um agente para gerar vídeos com Veo e imagens com Imagen.
mcp:
  name: gflow-cli
  stdio:
    command: uvx
    args:
      - gflow-cli
origin:
  list: mcp-registry
  ref: io.github.ffroliva/gflow-cli
