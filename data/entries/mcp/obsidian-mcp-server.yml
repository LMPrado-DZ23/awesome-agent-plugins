# yaml-language-server: $schema=../../../schema/entry.schema.json
id: obsidian-mcp-server
name: cyanheads/obsidian-mcp-server
title: Obsidian notes access
url: https://github.com/cyanheads/obsidian-mcp-server
type: mcp-server
category: memory
license: Apache-2.0
tags:
  - memory
  - obsidian
  - notes
description:
  en: Reads, writes, searches, and edits Obsidian notes, tags, and frontmatter; needs an OBSIDIAN_API_KEY.
  pt: Lê, escreve, busca e edita notas, tags e frontmatter do Obsidian; exige OBSIDIAN_API_KEY.
mcp:
  name: obsidian-mcp-server
  stdio:
    command: npx
    args:
      - "-y"
      - obsidian-mcp-server
    env:
      OBSIDIAN_API_KEY: <OBSIDIAN_API_KEY>
origin:
  list: mcp-registry
  ref: io.github.cyanheads/obsidian-mcp-server
