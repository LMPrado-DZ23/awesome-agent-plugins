# yaml-language-server: $schema=../../../schema/entry.schema.json
id: mcp-google-map
name: Google Maps MCP Server
title: Google Maps tools
url: https://github.com/cablate/mcp-google-map
type: mcp-server
category: integrations
license: MIT
tags:
  - maps
  - google
description:
  en: "18 Google Maps tools for agents: geocode, search, directions, and weather; needs a GOOGLE_MAPS_API_KEY."
  pt: "18 ferramentas do Google Maps para agentes: geocode, busca, rotas e clima; exige GOOGLE_MAPS_API_KEY."
mcp:
  name: google-map
  stdio:
    command: npx
    args:
      - "-y"
      - "@cablate/mcp-google-map"
    env:
      GOOGLE_MAPS_API_KEY: <GOOGLE_MAPS_API_KEY>
origin:
  list: mcp-registry
  ref: io.github.cablate/google-map
