# yaml-language-server: $schema=../../../schema/entry.schema.json
id: dsh-dsh-desktop-windowos
name: RAFOLIE/dsh-desktop-windowos
title: Windows tray desktop shell
url: https://github.com/RAFOLIE/dsh-desktop-windowos
type: native-plugin
category: ui
license: MIT
tags:
  - desktop
  - windows
  - tray
description:
  en: >-
    A Windows tray desktop shell for DeepSeek Harness that auto-installs and auto-updates its executable from GitHub
    Releases, creates desktop shortcuts for the app and the web UI, and exposes a desktop_launch tool to start it from
    the conversation.
  pt: >-
    Um shell de desktop na bandeja do Windows para o DeepSeek Harness que instala e atualiza automaticamente seu
    executável a partir dos GitHub Releases, cria atalhos de desktop para o app e a interface web, e expõe uma
    ferramenta desktop_launch para iniciá-lo a partir da conversa.
native:
  client: dsh
  install: dsh plugin --profile web add github:RAFOLIE/dsh-desktop-windowos
origin:
  list: awesome-dsh-plugin
  ref: 5ae6a947031d065690e872a6d1d42d84c481b52d
