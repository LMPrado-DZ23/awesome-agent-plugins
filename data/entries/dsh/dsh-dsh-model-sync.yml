# yaml-language-server: $schema=../../../schema/entry.schema.json
id: dsh-dsh-model-sync
name: jiay98528-dev/dsh-model-sync
title: Live model catalog and plan usage
url: https://github.com/jiay98528-dev/dsh-model-sync
type: native-plugin
category: models
license: MIT
tags:
  - model-catalog
  - usage
  - plan-quota
  - configuration
description:
  en: >-
    Writes live provider model lists into settings and shows the 5h/7d plan window or metered balance for the current
    session model.
  pt: >-
    Grava listas de modelos dos provedores ao vivo nas configurações e mostra a janela de plano de 5h/7d ou o saldo
    medido do modelo da sessão atual.
native:
  client: dsh
  install: dsh plugin --profile web add github:jiay98528-dev/dsh-model-sync
alternatives:
  - name: HOWILLMAKEIT/dsh-model-context-catalog
    url: https://github.com/HOWILLMAKEIT/dsh-model-context-catalog
    adds:
      en: Configures the context-window size for registered models so long sessions aren't misjudged as overflowing.
      pt: >-
        Configura o tamanho da janela de contexto para modelos registrados, evitando que sessões longas sejam julgadas
        erroneamente como estouradas.
origin:
  list: awesome-dsh-plugin
  ref: 5ae6a947031d065690e872a6d1d42d84c481b52d
