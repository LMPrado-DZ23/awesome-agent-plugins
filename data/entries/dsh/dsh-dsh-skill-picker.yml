id: dsh-dsh-skill-picker
name: a735624258/dsh-skill-picker
title: Searchable skill picker
url: https://github.com/a735624258/dsh-skill-picker
type: native-plugin
category: ui
license: MIT
tags:
  - skills
  - picker
