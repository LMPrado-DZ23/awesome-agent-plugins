description:
  en: >-
    A WorkBuddy-style skill picker: a button beside the composer opens a searchable list of installed skills, and
    picking one inserts the official /skill-name gesture so the skill loads with the message.
  pt: >-
    Um seletor de skills no estilo WorkBuddy: um botão ao lado do compositor abre uma lista pesquisável de skills
    instaladas, e escolher uma insere o comando oficial /nome-da-skill para que ela carregue junto com a mensagem.
native:
  client: dsh
  install: dsh plugin --profile web add github:a735624258/dsh-skill-picker
