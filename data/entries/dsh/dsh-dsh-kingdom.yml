id: dsh-dsh-kingdom
name: lusblead/dsh-Kingdom
title: Agent governance and role bindings
url: https://github.com/lusblead/dsh-Kingdom
type: native-plugin
category: workflow
license: AGPL-3.0
tags:
  - workflow
  - governance
