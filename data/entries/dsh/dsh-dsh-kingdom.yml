description:
  en: >-
    Agent governance for DeepSeek Harness: territories, role bindings with model or agent identity, and a
    plan-assign-execute-review task loop where worker claims never auto-complete, plus a local GUI operations console.
  pt: >-
    Governança de agentes para o DeepSeek Harness: territórios, vínculos de papel com identidade de modelo ou agente, e
    um loop de tarefas planejar-atribuir-executar-revisar em que reivindicações do worker nunca se concluem sozinhas,
    além de um console de operações GUI local.
native:
  client: dsh
  install: dsh plugin --profile web add github:lusblead/dsh-Kingdom
