# yaml-language-server: $schema=../../../schema/entry.schema.json
id: dsh-dsh-better-edit
name: Rianico/dsh-better-edit
title: Hash-anchored file editing
url: https://github.com/Rianico/dsh-better-edit
type: native-plugin
category: tools
license: MIT
tags:
  - editing
  - file-tools
  - undo
description:
  en: >-
    Hash-anchored read / edit / batch_edit / undo_last_edit tools: every line gets a unique 3-character content hash,
    edits target hashes instead of line numbers, and served-state verification rejects stale ranges with fresh anchors.
  pt: >-
    Ferramentas read / edit / batch_edit / undo_last_edit ancoradas em hash: cada linha recebe um hash de conteúdo único
    de 3 caracteres, as edições miram hashes em vez de números de linha, e a verificação do estado servido rejeita
    intervalos desatualizados com novas âncoras.
native:
  client: dsh
  install: dsh plugin --profile web add github:Rianico/dsh-better-edit
origin:
  list: awesome-dsh-plugin
  ref: 5ae6a947031d065690e872a6d1d42d84c481b52d
