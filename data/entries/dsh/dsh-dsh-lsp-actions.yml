  pt: >-
    Superfície de ações LSP para o DSH: diagnósticos, formatação, autocompletar, ações de código, símbolos, ajuda de
    assinatura, inlay hints e renomeação, todos apoiados por language servers reais.
native:
  client: dsh
  install: dsh plugin --profile web add github:PerryLink/dsh-lsp-actions
origin:
  list: awesome-dsh-plugin
