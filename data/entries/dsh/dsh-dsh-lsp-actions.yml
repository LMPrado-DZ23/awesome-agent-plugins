id: dsh-dsh-lsp-actions
name: PerryLink/dsh-lsp-actions
title: Language server actions
url: https://github.com/PerryLink/dsh-lsp-actions
type: native-plugin
category: tools
license: Apache-2.0
tags:
  - lsp
  - code-intelligence
  - refactoring
description:
