# yaml-language-server: $schema=../../../schema/entry.schema.json
id: dsh-dsh-passwords
name: slywalker2006/dsh-passwords
title: Multi-tenant server security platform
url: https://github.com/slywalker2006/dsh-passwords
type: native-plugin
category: security
license: GPL-3.0
tags:
  - multi-tenant
  - remote-access
  - quotas
  - sandbox
description:
  en: >-
    Turns the harness into a server-grade multi-tenant platform: remote access with automatic HTTPS, per-subuser
    permissions with token and daily quotas, sandbox enforcement, encrypted authentication, and an audit log.
  pt: >-
    Transforma o harness em uma plataforma multi-tenant de nível servidor: acesso remoto com HTTPS automático,
    permissões por subusuário com cotas de token e diárias, sandbox obrigatório, autenticação criptografada e log de
    auditoria.
native:
  client: dsh
  install: dsh plugin --profile web add github:slywalker2006/dsh-passwords
origin:
  list: awesome-dsh-plugin
  ref: 5ae6a947031d065690e872a6d1d42d84c481b52d
