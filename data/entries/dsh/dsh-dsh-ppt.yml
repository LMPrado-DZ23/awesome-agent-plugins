    Turns one sentence or a document into an HTML slideshow plus an editable PPTX, with seven layouts (including quotes
    and native PPTX tables), speaker notes, five built-in themes and bilingual support.
  pt: >-
    Transforma uma frase ou um documento em uma apresentação HTML mais um PPTX editável, com sete layouts (incluindo
    citações e tabelas PPTX nativas), notas do apresentador, cinco temas embutidos e suporte bilíngue.
native:
  client: dsh
  install: dsh plugin --profile web add github:STARDUSTLC666/dsh-ppt
