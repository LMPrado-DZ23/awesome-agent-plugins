# yaml-language-server: $schema=../../../schema/entry.schema.json
id: agents-cli
name: google/agents-cli
title: Google Cloud agent development CLI
url: https://github.com/google/agents-cli
type: native-plugin
category: cloud
license: Apache-2.0
tags:
  - cloud
  - google-cloud
  - agents
description:
  en: >-
    CLI and skills that turn any coding assistant into an expert at creating, evaluating and deploying AI agents on
    Google Cloud's Agent Development Kit.
  pt: >-
    CLI e skills que transformam qualquer assistente de código em especialista em criar, avaliar e implantar agentes de
    IA no Agent Development Kit do Google Cloud.
native:
  client: gemini-cli
  install: gemini extensions install https://github.com/google/agents-cli
origin:
  list: github-discovery
  ref: gemini-extension
