    url: https://github.com/zarazhangrui/frontend-slides
    adds:
      en: Creates web-based slide decks using the coding agent's own frontend skills instead of native PowerPoint files.
      pt: >-
        Cria apresentações baseadas na web usando as próprias skills de frontend do agente de código, em vez de arquivos
        PowerPoint nativos.
  - name: chuspeeism/dashi-ppt-skill
    url: https://github.com/chuspeeism/dashi-ppt-skill
    adds:
      en: Generates browser-editable presentations from multiple visual themes, exportable to HTML, PDF and PPTX.
      pt: Gera apresentações editáveis no navegador a partir de vários temas visuais, exportáveis para HTML, PDF e PPTX.
origin:
