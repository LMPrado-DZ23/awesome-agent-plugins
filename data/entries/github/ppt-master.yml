# yaml-language-server: $schema=../../../schema/entry.schema.json
id: ppt-master
name: hugohe3/ppt-master
title: AI PowerPoint generation skill
url: https://github.com/hugohe3/ppt-master
type: skill-pack
category: tools
license: MIT
tags:
  - presentations
  - tools
  - pptx
description:
  en: >-
    Turns documents or topics into native, editable PowerPoint decks with real shapes, transitions, data-backed charts,
    tables and optional narration.
  pt: >-
    Transforma documentos ou temas em apresentações PowerPoint nativas e editáveis, com formas reais, transições,
    gráficos e tabelas com dados e narração opcional.
skill:
  source: hugohe3/ppt-master
alternatives:
