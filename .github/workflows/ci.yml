name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate entries (schema, duplicates, no secrets)
        run: npm run validate
      - name: Generated files are up to date
        run: node scripts/generate.mjs --check
      - name: Tests
        run: npm test
      - name: At most 3 new entries per PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD -- 'data/entries/**/*.yml' | wc -l || true)
          echo "new entries: $added"
          if [ "$added" -gt 3 ]; then echo "::error::Please split: at most 3 new entries per PR"; exit 1; fi
